events {}

http {
    resolver 127.0.0.11 ipv6=off valid=5s;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index startPageTemplate.html;

        location /ws {
            set $backend game_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_pass http://$backend:8000;
        }

        location /router/ {
            set $router game_router;
            proxy_pass http://$router:7000/;
        }

        # Serve gamePageTemplate.html at /game
        location = /start {
            try_files /loadingPage.html =404;
        }

        # Serve gamePageTemplate.html at /game
        location = /game {
            try_files /gamePageTemplate.html =404;
    }

        location = /end {
            try_files /leaderboardTemplate.html = 404;
        }
    }
}
