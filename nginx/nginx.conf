events {}

http {
    upstream web_backend {
        server game_server:8000;
    }
    upstream router_backend {
        server game_router:7000;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index startPageTemplate.html;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_pass http://web_backend;
        }

        location /router/ {
            proxy_pass http://router_backend/;
        }

        # Serve gamePageTemplate.html at /game
        location = /start {
            try_files /loadingPage.html =404;
        }

        # Serve gamePageTemplate.html at /game
        location = /game {
            try_files /gamePageTemplate.html =404;
    }

        location = /end {
            try_files /leaderboardTemplate.html = 404;
        }
    }
}
