events {}

http {
    resolver 127.0.0.11 ipv6=off valid=5s;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index startPageTemplate.html;

        location /ws {
            set $target $arg_target;
            if ($target = "") { set $target "game_server:8000"; }
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_pass http://$target;
        }

        # Direct passthroughs to router API (explicit to avoid rewrite issues)
        location = /router/games/open {
            proxy_pass http://game_router:7000/games/open;
        }
        location = /router/games/start {
            proxy_pass http://game_router:7000/games/start;
        }
        location = /router/games/allocate {
            proxy_pass http://game_router:7000/games/allocate;
        }
        location = /router/status {
            proxy_pass http://game_router:7000/status;
        }
        location /router/ {
            rewrite ^/router/(.*)$ /$1 break;
            proxy_pass http://game_router:7000;
        }

        # Serve gamePageTemplate.html at /game
        location = /start {
            try_files /loadingPage.html =404;
        }

        # Serve gamePageTemplate.html at /game
        location = /game {
            try_files /gamePageTemplate.html =404;
    }

        location = /end {
            try_files /leaderboardTemplate.html = 404;
        }
    }
}
