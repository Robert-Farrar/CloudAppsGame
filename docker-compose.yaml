version: "3.8"

services:
  # Nginx proxxy
  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "81:80"             
    # For now read only volume, this will have to change for when we get https so certbot can update expired certs  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web                   
    restart: always
    networks:
      - appnet

  # Web / Application Server
  web:
    container_name: web
    build:
      context: ./websocketForGameServer
      dockerfile: Dockerfile
    expose:
      - "8500"
    environment:
      DATABASE_URL: "mysql://user:password@db:3306/mydb"
    depends_on:
      - db
    restart: always
    networks:
      - appnet
      
  # Database 
  db:
    container_name: database
    build:
      context: ./Database
      dockerfile: Dockerfile
    volumes:
      - dbdata:/var/lib/mysql
      - ./Database/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    ports:
      - "3307:3306"
    restart: always
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  dbdata:
    driver: local
