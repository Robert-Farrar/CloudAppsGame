version: "3.8"

services:
  # Nginx proxxy
  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: NginxDockerfile
    ports:
      - "81:80"             
    # For now read only volume, this will have to change for when we get https so certbot can update expired certs  
    depends_on:
      - game_server                  
    restart: always
    networks:
      - appnet

  # Web / Application Server
  game_server:
    container_name: game_server
    build:
      context: ./websocketForGameServer
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DB_HOST: "db"
      DB_USER: "cloud"
      DB_PASSWORD: "ThisIsThePassword1!"
      DB_NAME: "cloudgame" 
      DATABASE_URL: "mysql://cloud:ThisIsThePassword1!@db:3306/cloudgame"
    depends_on:
      - db
    restart: always
    networks:
      - appnet
      
  # Database 
  db:
    container_name: database
    build:
      context: ./Database
      dockerfile: Dockerfile
    volumes:
      - dbdata:/var/lib/mysql
      - ./Database/db.sql:/docker-entrypoint-initdb.d/db.sql
    ports:
      - "3307:3306"
    restart: always
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  dbdata:
    driver: local
