<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Number Crunch - Multiplayer Card Challenge</title>
    <!--bootsrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="games.css">
</head>

<body class="bg-gray-100">

    <header class="container header-card">
        <h1 class="title">The Number Crunch</h1>
        <p id="user-info" class="user-info">Status: Initializing...</p>
        <p id="connection-status" class="connection-status">WebSocket: Disconnected</p>
    </header>

    <main class="container main-game-area">

        <!-- Game Info & Turn Status -->
        <div class="text-center mb-6">
            <h2 id="turn-status" class="status-heading">Waiting for opponent...</h2>
            <div id="message-box" class="message-box"></div>
        </div>

        <!-- Opponent Area -->
        <div class="opponent-area">
            <h3 class="text-lg font-medium text-gray-500 mb-2">Opponent's Play Area</h3>
            <div id="opponent-play-area" class="play-slot">
                <span class="text-gray-400">Card played: None</span>
            </div>
        </div>

        <!-- Center Table / Last Card Played -->
        <div class="last-card-container">
            <h3 class="text-xl font-bold text-neutral mb-3">Last Card Played</h3>
            <div id="last-card-display" class="card card-secondary bg-gray-300">
                <span class="text-3xl font-bold text-white">?</span>
            </div>
        </div>

        <!-- Player Hand Area -->
        <div class="hand-area">
            <h3 class="text-lg font-medium text-gray-500 mb-4">Your Hand (<span id="player-turn-status"
                    class="text-red-600 font-bold">WAIT</span>)</h3>
            <div id="player-hand" class="hand-cards">
                <!-- Cards will be injected here -->
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="games.js"></script>

</body>

</html>
