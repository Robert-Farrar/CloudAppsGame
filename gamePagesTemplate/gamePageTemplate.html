<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Number Crunch - Multiplayer Card Challenge</title>
    <style>
        body {
            background-image: url(images/gamePageBGAni2.gif);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
/* Flip card styles */
        .flip-card {
            position: fixed;
            right: 5vw;
            bottom: 5vh;
            width: 30vw;
            max-width: 300px;
            height: 30vw;
            max-height: 300px;
            perspective: 1000px;
            margin-bottom: 46px;
            margin-right: 2px;
            z-index: 100;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.is-flipped {
            transform: translateX(-400px); /* Moves left when flipped will need jscript to check if position is filled*/
        }
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front{ /* Technically the back of the card. Do not change */
            position: absolute;
            width: 213px;
            height: 294px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
            border-radius: 8px;
            background: transparent;
            /* Add glow effect to deminstare clickable object*/
            box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #36e6006e, 0 0 40px #2fff1398, 0 0 50px #2ee60098, 0 0 60px #86ff16d5, 0 0 70px #1dfa1598;;
        }
        .flip-card-back { /* Technically the face of the card. Do not change*/
            position: absolute;
            width: 233px;
            height: 314px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateY(180deg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
            border-radius: 8px;
            background: transparent;
        }
        .flip-card-front img.card-image {
            width: 213px;
            height: 294px;
            object-fit: contain;
        }
        .flip-card-back img.back-card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .deck { /* Just displays the deck. Card front should be positioned over this always */
            position: fixed;
            right: 5vw;
            bottom: 5vh;
            width: 223x;
            height: 314px;
            perspective: 1000px;
            margin-right: 45px;
            margin-bottom: 30px;
            z-index: 100;
        }
 /* Popup styles */       
        .form-popup {
            position: fixed;
            right: 50%;
            bottom: 50%;
            transform: translate(50%, 50%);
            width: 600px;
            height: 400px;
            background-image: url("images/matchW.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 20px;
            z-index: 200;
            border: none;
        }
        #popup_box {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 400px;
        background-image: url("images/matchW.png");
        background-size: 100% 100%;
        background-repeat: no-repeat;
        padding: 20px;
        z-index: 200;
        border: none;
        box-sizing: border-box;
        }        
        #questionAnswer {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-top: 20%;
            margin-left: 27%;
        }
        #btnAnswer {
        background-image: url('images/answerbtn.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-color: transparent;
        width: 279px;
        height: 90px;
        border: none;
        display: block;
        margin: 30px auto 0;
        }
        #btnAnswer:hover {
            cursor: pointer;
            transform: scale(1.05);
        }
        #popupBoxClose { 
        padding: 20px;
        display: block;
        position: relative;
        text-align: right;
        }
        #popupBoxClose #countDown {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 50px;
        height: 50px;
        background: #ff0000;
        color: rgb(3, 3, 3);
        text-align: center;
        -webkit-border-radius: 50%;
        border-radius: 50%;
        font-size: 40px;
        font-weight: bold;
        }
        #correctMessage {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: green;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            display: none;
            z-index: 250;
        }
        #wrongMessage {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: red;
            text-shadow: 0 0 10px red, 0 0 20px red;
            display: none;
            z-index: 250;
        }

    </style>
</head>
<body>
     <div class="deck" id="deck">   
        <img src="images/cardDeck.png" alt="card deck img" style="width:100%;height:100%;object-fit:contain;"> 
     </div>
<!-- Flip Card -->
    <div class="flip-card" id="mainFlipCard" aria-label="card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <!-- card image will be inserted here -->
                <img class="card-image" src="images/cards/cardBack.png" alt="card front">
            </div>
            <div class="flip-card-back">
                <!-- card image from the card object will be inserted here -->
                <img class="back-card-image" src="images/cards/blankCard.png" alt="card back" style="width:100%;height:100%;object-fit:contain;">
            </div>
        </div>
    </div>
 
<!-- Start Pop up-->
<!-- The form needs to pop up or openForm() when a match is made. The generated question should be passed into the form.
     the user will then answer and hit the botton. button will need to close the form and send the given answer
     to be checked.-->
    <div id="popup_box">
        <a id="popupBoxClose"><span id="countDown"></span></a>  
        <form action="" method="post">
            <div id="questionAnswer">
                <label for="question" style="font-size: xxx-large;">
                    <b id="battleQuestion"><!-- Question goes here --> 7 + 3 = </b>
                </label>
                <input type="answer" id="answerInput" placeholder=" ?" style="font-size: xxx-large; width: 100px; margin-left: 10px;" name="ans" required>
            </div>
            <button type="submit" id="btnAnswer" onclick="closeform()"></button> 
        </form> 
    </div>

    <div id="correctMessage">+1</div>
    <div id="wrongMessage">Wrong!</div>

    <script src="cardDeck.js"></script><!-- Script for flip card: Holds all possible cards and a get random card method -->
    <script>
let ws = null;
let reconnectTimeout = null;


let popupInstance = null;
let userId = null;
let gameId = 1;  // You hardcoded 1 — keeping that
let username = "";
let pendingBattle = null;

const flipCardEl = document.getElementById("mainFlipCard");
flipCardEl.style.pointerEvents = "none";

window.addEventListener("DOMContentLoaded", () => {
    console.log("DOM loaded → Initializing popup + websocket");
    userId = sessionStorage.getItem('user_id');
    username = sessionStorage.getItem('username')
    popupInstance = new Popup(document.getElementById("popup_box"));
    connectWebSocket();

    // If a battle arrived before popup existed → load now
    if (pendingBattle) {
        console.warn("Applying pending battle...");
        popupInstance.load(pendingBattle);
        pendingBattle = null;
    }
});

function connectWebSocket() {
    console.log("Connecting WebSocket...");
    ws = new WebSocket(`ws://${window.location.host}/ws`);

    ws.onopen = () => {
        console.log("WebSocket connected.");
        console.log("User ID: " + userId)
        // Send RECONNECT or CONNECT depending on your protocol
        ws.send(JSON.stringify({
            type: "CONNECT",
            payload: {
                user_id: userId,
                username: username
            }
        }));

        console.log("RECONNECT message sent.");

         flipCardEl.style.pointerEvents = 'auto';
    };

    ws.addEventListener("message", (event) => {
        const msg = JSON.parse(event.data);
        console.log("WS MESSAGE:", msg);

        const isBattle =
            msg.type === "BATTLE" ||
            msg.data?.type === "BATTLE";

        const isPoint =
            msg.type === "POINT" ||
            msg.data?.type === "POINT";

        const isWrong =
            msg.type === "WRONG" ||
            msg.data?.type === "WRONG";

        if (isBattle) {
            console.warn("BATTLE EVENT RECEIVED:", msg.data);

            if (!popupInstance) {
                console.error("Popup not ready → queueing battle");
                pendingBattle = msg.data;
                return;
            }

            popupInstance.load(msg.data);
            return;
        }

        if (isPoint) {
            console.log("POINT EVENT RECEIVED:", msg.data);
            popupInstance.showCorrect();

            return;
        }

        if (isWrong) {
            console.log("WRONG EVENT RECEIVED:", msg.data);
            popupInstance.showWrong();
            return;
        }

        // TURN logic
        if (
            msg.type === "TURN" ||
            (msg.type === "STATUS" && msg.data?.message?.includes("It is now your turn."))
        ) {
            enableCardDraw();
        }


        if(msg.type === "FINISH"){
            console.log("Redirecting to leaderboard");
            window.location.href = "/end"; // Redirect to the game page
        }
    });

    ws.addEventListener("close", (event) => {
        console.warn(`WS closed: code ${event.code}`);

        if (event.code !== 1000) {
            console.warn("Auto-reconnecting in 1500ms...");
            reconnectTimeout = setTimeout(connectWebSocket, 1500);
        }
    });

    ws.addEventListener("error", (err) => {
        console.error("WS ERROR:", err);
    });
}

// ---- Flip card click handler ----
(function setupCardFlip() {
    const frontImg = flipCardEl.querySelector(".flip-card-front img.card-image");
    const backImg = flipCardEl.querySelector(".flip-card-back img.back-card-image");

    function fetchCardByIdOrRandom(id) {
        if (typeof window.getRandomCard === "function") {
            return typeof id === "number"
                ? window.getRandomCard([id])
                : window.getRandomCard();
        }
        return null;
    }

    function renderCard(card) {
        if (card?.img) backImg.src = card.img;
    }

    flipCardEl.addEventListener("click", () => {
        if (flipCardEl.classList.contains("is-flipped")) return;

        if (!userId || !gameId) {
            console.warn("Missing user/game ID — cannot play card");
            return;
        }

        const card = fetchCardByIdOrRandom();
        if (!card) return;

        renderCard(card);

        if (ws.readyState === WebSocket.OPEN) {
            ws.send(
                JSON.stringify({
                    type: "PLAY_CARD",
                    payload: {
                        color: card.color,
                        value: card.value,
                        operator: card.sign,
                        user_id: String(userId),
                        username: username,
                        game_id: String(gameId)
                    },
                })
            );
            console.log("PLAY_CARD SENT:", card);
        } else {
            console.warn("WS not open — reconnecting");
            connectWebSocket();
        }

        flipCardEl.classList.add("is-flipped");
        flipCardEl.style.pointerEvents = "none";
    });

    window.addEventListener("DOMContentLoaded", () => {
        const initial = fetchCardByIdOrRandom();
        if (initial) renderCard(initial);
    });
})();


function enableCardDraw() {
    flipCardEl.classList.remove("is-flipped");
    flipCardEl.style.pointerEvents = "auto";

    const backImg = flipCardEl.querySelector(".flip-card-back img.back-card-image");
    backImg.src = "images/cards/blankCard.png";

    console.log("Your turn — click to draw a card.");
}

// ---- Popup logic ----
function Popup(popup) {
    this.popup = popup;
    this.timer = null;
    this.counter = 10;
    this.countDownEl = popup.querySelector("#countDown");
    this.battleQuestionEl = document.getElementById("battleQuestion");
    this.correctMsgEl = document.getElementById("correctMessage");
    this.wrongMsgEl = document.getElementById("wrongMessage");

    this.load = (battleData) => {
        console.log("Popup.load():", battleData);

        if (this.battleQuestionEl) {
            const op = battleData.card1_operator;
            const v1 = battleData.card1_value;
            const v2 = battleData.card2_value;
            this.battleQuestionEl.textContent = `${v1} ${op} ${v2} = `;
        }

        this.counter = 8;
        if (this.countDownEl) this.countDownEl.textContent = this.counter;

        popup.style.display = "block";
        popup.style.opacity = "1";

        const form = popup.querySelector("form");
        form.onsubmit = (e) => {
            e.preventDefault();

            let answer = form.querySelector("input[name='ans']").value;
            if (!answer) {
                answer = -999;
            } else {
                answer = parseFloat(answer);
            }

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(
                    JSON.stringify({
                        type: "ANSWER",
                        payload: {
                            answer,
                            user_id: userId,
                            username: username,
                            game_id: gameId
                        },
                    })
                );
                console.log("ANSWER SENT:", answer);
            }

            this.unload();
        };

        // Countdown
        this.timer = setInterval(() => {
            this.counter--;
            if (this.counter < 0) {
                // Auto-submit on timeout - manually trigger the answer submission
                let answer = form.querySelector("input[name='ans']").value;
                if (!answer) {
                    answer = -999;
                } else {
                    answer = parseFloat(answer);
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(
                        JSON.stringify({
                            type: "ANSWER",
                            payload: {
                                answer,
                                user_id: userId,
                                game_id: gameId,
                            },
                        })
                    );
                    console.log("ANSWER SENT (timeout):", answer);
                }
                this.unload();
            } else {
                this.countDownEl.textContent = this.counter;
            }
        }, 1000);
    };

    this.showCorrect = () => {
        this.correctMsgEl.style.display = "block";
        setTimeout(() => {
            this.correctMsgEl.style.display = "none";
        }, 2000);
    };

    this.showWrong = () => {
        console.log("Showing wrong message");
        this.wrongMsgEl.style.display = "block";
        setTimeout(() => {
            this.wrongMsgEl.style.display = "none";
        }, 2000);
    };

    this.unload = () => {
        popup.style.display = "none";
        clearInterval(this.timer);
        this.timer = null;
        // Clear the input field for the next battle
        const form = popup.querySelector("form");
        if (form) {
            form.querySelector("input[name='ans']").value = "";
        }
    };
}
</script>

</body>
</html>
