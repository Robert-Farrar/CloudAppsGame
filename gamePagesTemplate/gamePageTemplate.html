<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Number Crunch - Multiplayer Card Challenge</title>
    <style>
        body {
            background-image: url(images/gamePageBGAni2.gif);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
/* Flip card styles */
        .flip-card {
            position: fixed;
            right: 5vw;
            bottom: 5vh;
            width: 30vw;
            max-width: 300px;
            height: 30vw;
            max-height: 300px;
            perspective: 1000px;
            margin-bottom: 46px;
            margin-right: 2px;
            z-index: 100;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.is-flipped {
            transform: translateX(-400px); /* Moves left when flipped will need jscript to check if position is filled*/
        }
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front{ /* Technically the back of the card. Do not change */
            position: absolute;
            width: 213px;
            height: 294px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
            border-radius: 8px;
            background: transparent;
            /* Add glow effect to deminstare clickable object*/
            box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #36e6006e, 0 0 40px #2fff1398, 0 0 50px #2ee60098, 0 0 60px #86ff16d5, 0 0 70px #1dfa1598;;
        }
        .flip-card-back { /* Technically the face of the card. Do not change*/
            position: absolute;
            width: 233px;
            height: 314px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateY(180deg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
            border-radius: 8px;
            background: transparent;
        }
        .flip-card-front img.card-image {
            width: 213px;
            height: 294px;
            object-fit: contain;
        }
        .flip-card-back img.back-card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .deck { /* Just displays the deck. Card front should be positioned over this always */
            position: fixed;
            right: 5vw;
            bottom: 5vh;
            width: 223x;
            height: 314px;
            perspective: 1000px;
            margin-right: 45px;
            margin-bottom: 30px;
            z-index: 100;
        }
 /* Popup styles */       
        .form-popup {
            position: fixed;
            right: 50%;
            bottom: 50%;
            transform: translate(50%, 50%);
            width: 600px;
            height: 400px;
            background-image: url("images/matchW.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 20px;
            z-index: 200;
            border: none;
        }
        #popup_box {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 400px;
        background-image: url("images/matchW.png");
        background-size: 100% 100%;
        background-repeat: no-repeat;
        padding: 20px;
        z-index: 200;
        border: none;
        box-sizing: border-box;
        }        
        #questionAnswer {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-top: 20%;
            margin-left: 27%;
        }
        #btnAnswer {
        background-image: url('images/answerbtn.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-color: transparent;
        width: 279px;
        height: 90px;
        border: none;
        display: block;
        margin: 30px auto 0;
        }
        #btnAnswer:hover {
            cursor: pointer;
            transform: scale(1.05);
        }
        #popupBoxClose { 
        padding: 20px;
        display: block;
        position: relative;
        text-align: right;
        }
        #popupBoxClose #countDown {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 50px;
        height: 50px;
        background: #ff0000;
        color: rgb(3, 3, 3);
        text-align: center;
        -webkit-border-radius: 50%;
        border-radius: 50%;
        font-size: 40px;
        font-weight: bold;
        }

    </style>
</head>
<body>
     <div class="deck" id="deck">   
        <img src="images/cardDeck.png" alt="card deck img" style="width:100%;height:100%;object-fit:contain;"> 
     </div>
<!-- Flip Card -->
    <div class="flip-card" id="mainFlipCard" aria-label="card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <!-- card image will be inserted here -->
                <img class="card-image" src="images/cards/cardBack.png" alt="card front">
            </div>
            <div class="flip-card-back">
                <!-- card image from the card object will be inserted here -->
                <img class="back-card-image" src="images/cards/blankCard.png" alt="card back" style="width:100%;height:100%;object-fit:contain;">
            </div>
        </div>
    </div>
    
<!-- Start Pop up-->
<!-- The form needs to pop up or openForm() when a match is made. The generated question should be passed into the form.
     the user will then answer and hit the botton. button will need to close the form and send the given answer
     to be checked.-->
    <div id="popup_box">
        <a id="popupBoxClose"><span id="countDown"></span></a>  
        <form action="" method="post">
            <div id="questionAnswer">
                <label for="question" style="font-size: xxx-large;"><b><!-- Question goes here --> 7 + 3 = </b></label>
                <input type="answer" placeholder="  ?" style="font-size: xxx-large; width: 100px; margin-left: 10px;" name="ans" required>
            </div>
            <button type="submit" id="btnAnswer" onclick="closeform()"></button> 
        </form> 
    </div>

    <script src="cardDeck.js"></script><!-- Script for flip card: Holds all possible cards and a get random card method -->
    <script>
let ws = null;
let reconnectTimeout = null;
let popupInstance = null;

let userId = null;
let gameId = null;

// Disable the flip card until we have userId
const flipCardEl = document.getElementById('mainFlipCard');
flipCardEl.style.pointerEvents = 'none'; 

// Initialize popup instance after DOM is ready
window.addEventListener("DOMContentLoaded", () => {
    popupInstance = new Popup(document.getElementById("popup_box"));
});

function connectWebSocket() {
    console.log("Connecting websocket...");
    ws = new WebSocket(`ws://${window.location.host}/ws`);

    ws.addEventListener("open", () => {
        console.log("WS connected on game page.");
        // Request user + game data
        userId = sessionStorage.getItem('user_id');
        gameId = 1
        flipCardEl.style.pointerEvents = 'auto';
        if (!userId) {
        console.warn("User ID not found in sessionStorage, setting default value to '0'.");
        userId = "0";  // Default or fallback value
    }

    });

    ws.addEventListener("message", (event) => {
        const msg = JSON.parse(event.data);
        console.log("WS MESSAGE:", msg);


        if (msg.type === "TURN" || (msg.type === "STATUS" && msg.data?.message?.includes("It is now your turn."))) {
                console.log("Your Turn")
                enableCardDraw()
            }


        // Handle BATTLE messages
        if (msg.type === "BATTLE" && popupInstance) {
            // Pass card data to the popup for display if needed
            popupInstance.load(msg);
        }

        // Handle other messages (CARD, RESULT, etc.)
    });

    ws.addEventListener("close", () => {
        console.warn(`WS closed with code: ${event.code}, reason: ${event.reason}`);
        if (event.code !== 1000) {
        console.warn("Reconnecting in 1.5s...");
        reconnectTimeout = setTimeout(connectWebSocket, 1500);
    }
    });

    ws.addEventListener("error", (err) => {
        console.error("WS ERROR:", err);
    });
}

// Start WebSocket as soon as page loads
window.addEventListener("DOMContentLoaded", connectWebSocket);

// ---- Flip card click handler ----
(function() {
    const frontImg = flipCardEl.querySelector('.flip-card-front img.card-image');
    const backImg = flipCardEl.querySelector('.flip-card-back img.back-card-image');

    function fetchCardByIdOrRandom(id) {
        if (typeof window.getRandomCard === 'function') {
            return typeof id === 'number' ? window.getRandomCard([id]) : window.getRandomCard();
        }
        if (typeof window.getCardById === 'function') {
            return window.getCardById(id || 1);
        }
        return null;
    }

    function renderCard(card) {
        if (!card) return;
        if (card.img) backImg.src = card.img;
    }

    flipCardEl.addEventListener('click', function() {
        if (flipCardEl.classList.contains('is-flipped')) return;
        if (!userId || !gameId) {
            console.warn("Cannot play card before user/game IDs are set.");
            return;
        }

        const card = fetchCardByIdOrRandom();
        if (!card) return;

        renderCard(card);

        if (gameId && userId && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: "PLAY_CARD",
                payload: {
                    color: card.color,
                    value: card.value,
                    operator: card.sign,
                    user_id: String(userId),
                    game_id: String(gameId)
                }
            }));
            console.log("PLAY_CARD SENT:", {
                id: card.id,
                color: card.color,
                value: card.value,
                operator: card.sign,
                user_id: userId,
                game_id: gameId
            });
        }else {
        console.warn("WebSocket is not open. Attempting to reconnect.");
        connectWebSocket();  // Attempt to reconnect or notify user
        }

        flipCardEl.classList.add('is-flipped');
        flipCardEl.style.pointerEvents = 'none';
    });

    // Preload initial card
    window.addEventListener('DOMContentLoaded', function() {
        const initial = fetchCardByIdOrRandom();
        if (initial) renderCard(initial);
    });
})();

function enableCardDraw() {
    const flipCardEl = document.getElementById('mainFlipCard');
    flipCardEl.classList.remove('is-flipped');   // Reset flip state
    flipCardEl.style.pointerEvents = 'auto';     // Allow clicking again

    // Optional: reset card image to default back
    const backImg = flipCardEl.querySelector('.flip-card-back img.back-card-image');
    backImg.src = "images/cards/blankCard.png";  

    console.log("It's your turn! You can draw a card.");
}

// ---- Popup logic ----
function Popup(popup) {
    this.popup = popup;
    this.timer = null;
    this.counter = 10;
    this.countDownEl = this.popup.querySelector('#countDown');
    this._outsideHandler = null;
    this._closeHandler = null;

    this.load = (battleData) => {
        this.counter = 7;
        if (this.countDownEl) this.countDownEl.textContent = String(this.counter);

        // Show popup
        this.popup.style.display = 'block';
        this.popup.style.opacity = '0';
        setTimeout(() => { this.popup.style.opacity = '1'; }, 10);

        // Outside click to close
        this._outsideHandler = (e) => { if (!this.popup.contains(e.target)) this.unload(); };
        document.addEventListener('click', this._outsideHandler);

        // Close button
        const closeBtn = document.getElementById('popupBoxClose');
        this._closeHandler = (e) => { e.preventDefault(); this.unload(); };
        if (closeBtn) closeBtn.addEventListener('click', this._closeHandler);

        // Setup form submission
        const form = this.popup.querySelector('form');
        if (form) {
            form.onsubmit = (e) => {
                e.preventDefault();
                const answerInput = form.querySelector('input[name="ans"]');
                if (!answerInput || !answerInput.value) return;

                const answer = answerInput.value;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "ANSWER",
                        payload: {
                            answer: answer,
                            user_id: userId,
                            game_id: gameId
                        }
                    }));
                    console.log("ANSWER SENT:", answer);
                }

                this.unload();
            };
        }

        // Countdown
        this.timer = setInterval(() => {
            this.counter--;
            if (this.counter < 0) this.unload();
            else if (this.countDownEl) this.countDownEl.textContent = String(this.counter);
        }, 1000);
    };

    this.unload = () => {
        if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
        }

        if (this._outsideHandler) document.removeEventListener('click', this._outsideHandler);
        const closeBtn = document.getElementById('popupBoxClose');
        if (closeBtn && this._closeHandler) closeBtn.removeEventListener('click', this._closeHandler);

        this.popup.style.opacity = '0';
        setTimeout(() => { this.popup.style.display = 'none'; }, 250);
    };
}
</script>

</body>
</html>
