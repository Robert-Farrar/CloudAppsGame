<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - The Number Crunch</title>
    <style>
        body{
          display: flex;
          justify-content: flex-start;
          align-items: center;
          padding-top: 2%;
          flex-direction: column;
          text-align: center;
          min-height: 100vh;
        }
        table {
            width: 400px;
            height: auto;
            border-collapse: collapse;
            border-style: solid;
            border-width: 2px;
            border-color: #000;
            margin: 0 auto;
        }
        .line{
            border-bottom: 2px solid #000;
            border-style: double;
        }
        tr, td, th {
            border: 1px solid #000;
            padding: 8px 12px;
            text-align: center;
        }
    </style>
</head>
<header>
    
</header>
<body>

<h1>Leaderboard</h1>

<table class="table">
         <thead>
            <tr>
                <th class="line">Rank</th>
                <th class="line">Username</th>
                <th class="line">Score</th>                                        
            </tr>
         </thead>
         <tbody id="tableBody">
           
         </tbody>
   </table>
  <script>
    // Sample leaderboard data
    const leaderboardData = [
        { rank: 1, username: 'PlayerOne', score: 1500 },
        { rank: 2, username: 'GamerGirl', score: 1450 },
        { rank: 3, username: 'NoobMaster', score: 1400 },
        { rank: 4, username: 'ProGamer', score: 1350 },
        { rank: 5, username: 'Speedy', score: 1300 }
    ];

    // Function to populate the leaderboard table
    function populateLeaderboard() {
        const tableBody = document.getElementById('tableBody');
        leaderboardData.forEach(player => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${player.rank}</td>
                <td>${player.username}</td>
                <td>${player.score}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // Populate the leaderboard on page load
    window.onload = populateLeaderboard;
  </script>

</body>
</html>
